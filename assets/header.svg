<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#0F2A3A"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A5F3FC"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="260" rx="14"/></clipPath>
    <style>
      .w1 { animation: drift 9s linear infinite; }
      .w2 { animation: drift 14s linear infinite reverse; }
      .fade { animation: fadein 1.2s ease-out both; }
      .fade2 { animation: fadein 1.2s ease-out .4s both; }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-600px); } }
      @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <g fill="#22D3EE" opacity=".08">
      <circle cx="1040" cy="60" r="90"/><circle cx="140" cy="40" r="50"/>
    </g>
    <g font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="13" fill="#22D3EE" opacity=".35">
      <text x="40" y="40">const dev = new Engineer();</text>
      <text x="910" y="40">git push origin main</text>
    </g>
    <g text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
      <text class="fade" x="600" y="118" font-size="58" font-weight="700" fill="url(#txt)">Nabeekh Abid</text>
      <text class="fade2" x="600" y="158" font-size="20" fill="#94A3B8" letter-spacing="1">Full-stack engineer  ·  SaaS &amp; product builder</text>
    </g>
    <path class="w2" d="M0 212 Q 150.0 202 300.0 212 T 600.0 212 T 900.0 212 T 1200.0 212 T 1500.0 212 T 1800.0 212 L 1800.0 260 L 0 260 Z" fill="#22D3EE" opacity=".25"/>
    <path class="w1" d="M0 225 Q 150.0 213 300.0 225 T 600.0 225 T 900.0 225 T 1200.0 225 T 1500.0 225 T 1800.0 225 L 1800.0 260 L 0 260 Z" fill="#22D3EE" opacity=".55"/>
  </g>
</svg>
