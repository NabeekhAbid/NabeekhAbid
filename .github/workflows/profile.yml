# Redraws the README's Activity section every day from your GitHub data:
#   - activity.svg  (last 31 days graph)
#   - stats.svg     (total contributions + streaks)
#   - github-snake*.svg (the snake eating your contribution grid)
# Everything is saved to an `output` branch that the README reads from,
# so nothing depends on outside image services.
name: Update profile graphs

on:
  schedule:
    - cron: "0 0 * * *" # every day at 00:00 UTC (5 AM in Pakistan)
  workflow_dispatch: # lets you run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Draw activity graph and streak card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/stats.py "${{ github.repository_owner }}" dist

      - name: Draw contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Save graphs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
